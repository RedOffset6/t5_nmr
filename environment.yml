# conda env create -f environment.yml
# Python from conda; everything else from requirements.txt. For the exact
# package set used on Isambard-AI (linux-aarch64), install
# environment.lock.txt instead of requirements.txt.
name: t5
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
